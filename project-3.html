<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculater</title>
</head>
<style>
    body {
        background-color: #797978;
        text-align: center;
        margin-top: 30px;
    }

    button {
        width: 150px;
        height: 35px;
        color: #212121;
        border: 3px solid #212121;
        border-radius: 8px;
        font-size: larger;
    }

    #results {
        color: white;
        font-size: 3rem;
        margin-top: 10px;
    }
</style>

<body>
    <h1>BMI Calculater</h1>

    <form>
        <p> <label for="height">Height in CM:</label>
            <input type="text" id="height">
        </p>
        <p>
            <label for="weight">Weight in KG:</label>
            <input type="text" name="weight" id="weight">
        </p>
        <button>Calculate</button>

        <div id="results"></div>
        <div class="weight-guide">
            <h3>BMI weight guide</h3>
            <p>
                under weight = less then 18.6
            </p>
            <p>
                normal range = 18.6 to 25
            </p>
            <p>
                over weight = Greater then 25
            </p>
        </div>
    </form>
    <script src="project-3.js"></script>
</body>

</html>
